<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartea mea digitală</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #0d0d0d; color: #e0e0e0;
            font-family: 'Georgia', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden;
        }
        .book-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 95vw; }
        .book-container {
            max-width: 90vw; max-height: 75vh;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
            border-radius: 6px; overflow: hidden; background: #000; cursor: pointer;
        }
        .book-video { max-width: 100%; max-height: 75vh; object-fit: contain; display: block; }
        
        /* Stilizare pentru pagina de Cuprins generată direct în pagină */
        .toc-page-content {
            display: none;
            width: 100%; max-width: 700px; height: 75vh;
            background: #161616; border: 1px solid #333; border-radius: 6px;
            padding: 30px; overflow-y: auto; text-align: left;
        }
        .toc-page-content h2 { text-align: center; color: #f5f5f5; margin-top: 0; font-size: 24px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .toc-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .toc-item {
            background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 4px;
            cursor: pointer; display: flex; justify-content: space-between; transition: background 0.2s;
            font-size: 15px; border-bottom: 1px dashed #2a2a2a;
        }
        .toc-item:hover { background: rgba(255,255,255,0.08); color: #fff; }

        .controls {
            display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center;
            background: rgba(255, 255, 255, 0.05); padding: 12px 24px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1); margin-top: 15px;
        }
        button, select {
            background-color: #222; color: #fff; border: 1px solid #444;
            padding: 8px 16px; font-size: 15px; cursor: pointer; border-radius: 20px; outline: none;
        }
        button:hover, select:hover { background-color: #444; border-color: #666; }
        .page-indicator { font-size: 15px; min-width: 130px; text-align: center; color: #bbb; }
        
        .fullscreen-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; padding: 10px;
        }
        .fullscreen-video { max-width: 100%; max-height: 100vh; object-fit: contain; }
        .close-fullscreen {
            position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.2);
            color: #fff; border: none; font-size: 20px; padding: 10px 15px; border-radius: 50%; cursor: pointer; z-index: 1001;
        }
        .zoom-hint { font-size: 12px; color: #888; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="book-wrapper">
        <div class="book-container" id="bookContainer" onclick="openFullscreen()">
            <video id="pageVideo" class="book-video" autoplay playsinline></video>
            <div id="tocContentDiv" class="toc-page-content">
                <h2>CUPRINS</h2>
                <div id="tocGridList" class="toc-grid"></div>
            </div>
        </div>
        <div class="zoom-hint" id="zoomHint">🔍 Atinge videoclipul pentru mărire pe tot ecranul</div>
        
        <div class="controls">
            <button onclick="prevPage()">❮ Anteriorul</button>
            <span id="pageIndicator" class="page-indicator">Copertă</span>
            <button onclick="nextPage()">Următorul ❯</button>
            <select id="tocSelect" onchange="jumpToSlide(this.value)">
                <option value="0">Copertă</option>
                <option value="1">Pagina de Titlu</option>
            </select>
        </div>
    </div>

    <div id="fullscreenOverlay" class="fullscreen-overlay" onclick="closeFullscreen(event)">
        <button class="close-fullscreen">✕</button>
        <video id="fullscreenVideo" class="fullscreen-video" controls autoplay playsinline></video>
    </div>

    <script>
        // Lista exactă a poeziilor extrase din volumul tău
        const poemTitles = [
            "Cuvânt înainte", "Vasul", "Stația", "Balaurul", "Ecouri", "Țărmuri", "Siluete", 
            "Drumuri de munte", "Lacrima", "Șevalet", "Floarea Soarelui", "Flori de gheață", 
            "Gânduri", "La fereastră", "Orizont", "Înserare", "Melancolie", "Urbană", 
            "Nocturnă", "Amfora", "Primăvară", "Hibernală", "Ungher", "Era noastră", 
            "Aurea mediocritas", "Panta rei", "Evrika", "Q.E.D.", "Copilărie", "O, tempora", 
            "Sic transit", "Fumuri", "Stenahorie", "Jazz", "Orizont temporal", "Ecoul", 
            "Pastel", "Salon", "Călător", "Sonet alb", "Steaua", "Luceafăr", "Epitaf", "Postcard"
        ];

        const slides = [
            { title: "Copertă", file: "coperta.mp4", type: "video" },
            { title: "Pagina de Titlu", file: "titlu.mp4", type: "video" }
        ];

        // Adăugăm paginile video de la 1 la 44 cu titlurile corespunzătoare
        for (let i = 1; i <= 44; i++) {
            let titleName = poemTitles[i-1] ? `P. ${i}: ${poemTitles[i-1]}` : `Pagina ${i}`;
            slides.push({ title: titleName, file: `video${i}.mp4`, type: "video" });
        }

        // Adăugăm pagina de Cuprins interactiv la final
        slides.push({ title: "Cuprins", type: "toc" });

        let currentIndex = 0;
        const videoElement = document.getElementById("pageVideo");
        const tocContentDiv = document.getElementById("tocContentDiv");
        const bookContainer = document.getElementById("bookContainer");
        const zoomHint = document.getElementById("zoomHint");
        const fullscreenVideoElement = document.getElementById("fullscreenVideo");
        const fullscreenOverlay = document.getElementById("fullscreenOverlay");
        const indicatorElement = document.getElementById("pageIndicator");
        const selectElement = document.getElementById("tocSelect");
        const tocGridList = document.getElementById("tocGridList");

        function initToc() {
            // Meniul derulant
            for (let i = 2; i < slides.length - 1; i++) {
                let opt = document.createElement("option");
                opt.value = i; opt.innerText = slides[i].title;
                selectElement.appendChild(opt);
            }
            let optCuprins = document.createElement("option");
            optCuprins.value = slides.length - 1; optCuprins.innerText = "Cuprins (Final)";
            selectElement.appendChild(optCuprins);

            // Generarea listei vizuale din pagina de cuprins
            poemTitles.forEach((title, idx) => {
                let slideIndex = idx + 2; // pentru că primele 2 sunt Copertă și Titlu
                let div = document.createElement("div");
                div.className = "toc-item";
                div.innerHTML = `<span>${idx + 1}. ${title}</span> <span>➔</span>`;
                div.onclick = () => jumpToSlide(slideIndex);
                tocGridList.appendChild(div);
            });
        }

        function updateBook() {
            let currentSlide = slides[currentIndex];

            if (currentSlide.type === "toc") {
                videoElement.style.display = "none";
                tocContentDiv.style.display = "block";
                bookContainer.style.cursor = "default";
                zoomHint.style.visibility = "hidden";
                // Dacă aveai un audio de fundal pentru cuprins, poți rula ceva opțional, aici oprim videoclipul
                videoElement.pause();
            } else {
                tocContentDiv.style.display = "none";
                videoElement.style.display = "block";
                bookContainer.style.cursor = "pointer";
                zoomHint.style.visibility = "visible";

                videoElement.src = currentSlide.file;
                videoElement.load();
                videoElement.play().catch(err => console.log("Așteaptă interacțiune", err));
                
                if (fullscreenOverlay.style.display === "flex") {
                    fullscreenVideoElement.src = currentSlide.file;
                    fullscreenVideoElement.play();
                }
            }

            indicatorElement.innerText = currentSlide.title;
            selectElement.value = currentIndex;
        }

        function nextPage() {
            currentIndex = (currentIndex < slides.length - 1) ? currentIndex + 1 : 0;
            updateBook();
        }

        function prevPage() {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : slides.length - 1;
            updateBook();
        }

        function jumpToSlide(index) {
            currentIndex = parseInt(index);
            updateBook();
        }

        function openFullscreen() {
            if (slides[currentIndex].type === "toc") return; // Nu dăm zoom pe cuprinsul text
            fullscreenVideoElement.src = slides[currentIndex].file;
            fullscreenOverlay.style.display = "flex";
            fullscreenVideoElement.play();
        }

        function closeFullscreen(event) {
            if (!event || event.target === fullscreenOverlay || event.target.tagName === 'BUTTON') {
                fullscreenOverlay.style.display = "none";
                fullscreenVideoElement.pause();
                videoElement.play();
            }
        }

        document.addEventListener("keydown", (e) => {
            if (fullscreenOverlay.style.display === "flex") {
                if (e.key === "Escape") closeFullscreen();
                return;
            }
            if (e.key === "ArrowRight") nextPage();
            if (e.key === "ArrowLeft") prevPage();
        });

        window.onload = function() {
            initToc();
            updateBook();
        };
    </script>
</body>
</html>
