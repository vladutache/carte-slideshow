<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sufletul țărmurilor — Vlad Opran</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap');

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #05070c; color: #d6d6d6;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden;
        }

        /* --- LANDING PAGE --- */
        #landingPage {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100vw; height: 100vh;
            background: #090c12;
            padding: 0; margin: 0; position: relative;
        }

        /* Containerul imaginii devine referință pentru butoanele suprapuse */
        .artwork-container {
            position: relative;
            display: inline-block;
            max-width: 95vw;
            max-height: 95vh;
        }

        .artwork-img {
            max-height: 90vh; max-width: 100vw; object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: block;
        }

        /* Meniul suprapus direct pe partea de jos a imaginii, sub Vlad Opran */
        .landing-nav {
            position: absolute;
            bottom: 4%; /* reglează acest procentaj dacă vrei mai sus sau mai jos pe imagine */
            left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 40px; justify-content: center; align-items: center;
            width: 100%;
        }

        .nav-link {
            background: none; border: none;
            color: #f0c975; font-size: 24px; font-style: italic;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            cursor: pointer; transition: all 0.3s ease;
            padding: 5px 10px; text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .nav-link:hover {
            color: #ffffff; text-shadow: 0 0 12px rgba(240, 201, 117, 0.8);
            transform: translateY(-2px);
        }

        /* --- PLAYER VIDEO & CUPRINS --- */
        #bookApp {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 95vw; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .book-container {
            width: 90vw; height: 75vh; max-width: 1200px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 15px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.95);
            border-radius: 8px; overflow: hidden; background: #000;
            position: relative; border: 1px solid #222;
        }
        .book-video { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        .toc-page-content {
            display: none; width: 100%; height: 100%;
            background: #0d111a; border: 1px solid #222; border-radius: 8px;
            padding: 30px; overflow-y: auto; text-align: left;
        }
        .toc-page-content h2 { 
            text-align: center; color: #f0c975; margin-top: 0; 
            font-size: 32px; border-bottom: 1px solid #222; padding-bottom: 15px; font-style: italic;
        }
        .toc-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; 
        }
        .toc-item {
            background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px;
            cursor: pointer; display: flex; justify-content: space-between; transition: background 0.2s;
            font-size: 18px; font-style: italic; border-bottom: 1px dashed #222; color: #ccc;
        }
        .toc-item:hover { background: rgba(240,201,117,0.1); color: #f0c975; }

        .controls {
            display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center;
            background: rgba(255, 255, 255, 0.05); padding: 10px 20px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1); margin-top: 5px;
        }
        button, select {
            background-color: #121826; color: #fff; border: 1px solid #2b3854;
            padding: 8px 18px; font-size: 16px; cursor: pointer; border-radius: 20px; outline: none;
            font-family: 'Cormorant Garamond', 'Georgia', serif; font-style: italic;
        }
        button:hover, select:hover { background-color: #1e2942; border-color: #f0c975; }
        .page-indicator { font-size: 18px; font-style: italic; min-width: 130px; text-align: center; color: #bbb; }

        /* --- SECȚIUNI SECUNDARE --- */
        .sub-section {
            display: none; width: 90vw; max-width: 1000px; height: 80vh;
            background: #0d111a; border: 1px solid #1f293d; border-radius: 10px;
            padding: 40px; overflow-y: auto; text-align: left; position: relative;
        }
        .sub-section h2 { font-size: 32px; border-bottom: 1px solid #222; padding-bottom: 12px; margin-top: 0; color: #f0c975; font-style: italic; }
        .back-home-btn {
            margin-bottom: 20px; background: #121826; border: 1px solid #2b3854; color: #ccc;
            padding: 6px 16px; border-radius: 15px; cursor: pointer; font-size: 16px; font-style: italic;
        }
        .back-home-btn:hover { background: #1e2942; color: #fff; border-color: #f0c975; }
    </style>
</head>
<body>

    <!-- PAGINA DE ÎNTÂMPINARE -->
    <div id="landingPage">
        <div class="artwork-container">
            <!-- Imaginea curată cu Vlad Opran la bază -->
            <img src="ammonite-landing.jpg" alt="Sufletul țărmurilor — Vlad Opran" class="artwork-img" />
            
            <!-- Rubricile poziționate direct pe imagine, sub Vlad Opran -->
            <div class="landing-nav">
                <button class="nav-link" onclick="showSection('aboutSection')">Despre autor</button>
                <button class="nav-link" onclick="showBookApp()">Redă</button>
                <button class="nav-link" onclick="showSection('librarySection')">Bibliotecă</button>
            </div>
        </div>
    </div>

    <!-- SECȚIUNEA: DESPRE AUTOR -->
    <div id="aboutSection" class="sub-section">
        <button class="back-home-btn" onclick="showLanding()">❮ Înapoi</button>
        <h2>Despre autor</h2>
        <!-- Spațiu liber rezervat pentru textul tău -->
    </div>

    <!-- SECȚIUNEA: BIBLIOTECĂ -->
    <div id="librarySection" class="sub-section">
        <button class="back-home-btn" onclick="showLanding()">❮ Înapoi</button>
        <h2>Bibliotecă</h2>
        <p>Aici vor fi găzduite poezii, înregistrări și materiale suplimentare care nu fac parte direct din volumul principal.</p>
        <p style="color: #777; font-style: italic;">(În curând vor fi adăugate clipuri și texte noi)</p>
    </div>

    <!-- APLICAȚIA PRINCIPALĂ: CARTEA DIGITALĂ -->
    <div id="bookApp">
        <button class="back-home-btn" onclick="showLanding()" style="align-self: flex-start; margin-bottom: 10px;">❮ Înapoi la început</button>
        
        <div class="book-container">
            <video id="pageVideo" class="book-video" controls playsinline preload="auto"></video>
            <div id="tocContentDiv" class="toc-page-content">
                <h2>CUPRINS</h2>
                <div id="tocGridList" class="toc-grid"></div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="prevPage()">❮ Anteriorul</button>
            <span id="pageIndicator" class="page-indicator">Copertă</span>
            <button onclick="nextPage()">Următorul ❯</button>
            <select id="tocSelect" onchange="jumpToSlide(this.value)">
                <option value="0">Copertă</option>
                <option value="1">Pagina de Titlu</option>
            </select>
        </div>
    </div>

    <script>
        const landingPage = document.getElementById("landingPage");
        const bookApp = document.getElementById("bookApp");
        const aboutSection = document.getElementById("aboutSection");
        const librarySection = document.getElementById("librarySection");

        function showLanding() {
            landingPage.style.display = "flex";
            bookApp.style.display = "none";
            aboutSection.style.display = "none";
            librarySection.style.display = "none";
            document.getElementById("pageVideo").pause();
        }

        function showBookApp() {
            landingPage.style.display = "none";
            aboutSection.style.display = "none";
            librarySection.style.display = "none";
            bookApp.style.display = "flex";
            updateBook();
        }

        function showSection(sectionId) {
            landingPage.style.display = "none";
            bookApp.style.display = "none";
            aboutSection.style.display = "none";
            librarySection.style.display = "none";
            document.getElementById(sectionId).style.display = "block";
        }

        const poemTitles = [
            "Cuvânt înainte", "Vasul", "Stația", "Balaurul", "Ecouri", "Țărmuri", "Siluete", 
            "Drumuri de munte", "Lacrima", "Șevalet", "Floarea Soarelui", "Flori de gheață", 
            "Gânduri", "La fereastră", "Orizont", "Înserare", "Melancolie", "Urbană", 
            "Nocturnă", "Amfora", "Primăvară", "Hibernală", "Ungher", "Era noastră", 
            "Aurea mediocritas", "Panta rei", "Evrika", "Q.E.D.", "Copilărie", "O, tempora", 
            "Sic transit", "Fumuri", "Stenahorie", "Jazz", "Orizont temporal", "Ecoul", 
            "Pastel", "Salon", "Călător", "Sonet alb", "Steaua", "Luceafăr", "Epitaf", "Postcard"
        ];

        const slides = [
            { title: "Copertă", file: "coperta.mp4", type: "video" },
            { title: "Pagina de Titlu", file: "titlu.mp4", type: "video" }
        ];

        for (let i = 1; i <= 44; i++) {
            let titleName = poemTitles[i-1] ? `P. ${i}: ${poemTitles[i-1]}` : `Pagina ${i}`;
            slides.push({ title: titleName, file: `video${i}.mp4`, type: "video" });
        }

        slides.push({ title: "Cuprins", type: "toc" });

        let currentIndex = 0;
        const videoElement = document.getElementById("pageVideo");
        const tocContentDiv = document.getElementById("tocContentDiv");
        const indicatorElement = document.getElementById("pageIndicator");
        const selectElement = document.getElementById("tocSelect");
        const tocGridList = document.getElementById("tocGridList");

        function initToc() {
            for (let i = 2; i < slides.length - 1; i++) {
                let opt = document.createElement("option");
                opt.value = i; opt.innerText = slides[i].title;
                selectElement.appendChild(opt);
            }
            let optCuprins = document.createElement("option");
            optCuprins.value = slides.length - 1; optCuprins.innerText = "Cuprins (Final)";
            selectElement.appendChild(optCuprins);

            poemTitles.forEach((title, idx) => {
                let slideIndex = idx + 2;
                let div = document.createElement("div");
                div.className = "toc-item";
                div.innerHTML = `<span>${idx + 1}. ${title}</span> <span>➔</span>`;
                div.onclick = () => jumpToSlide(slideIndex);
                tocGridList.appendChild(div);
            });
        }

        function updateBook() {
            let currentSlide = slides[currentIndex];

            if (currentSlide.type === "toc") {
                videoElement.style.display = "none";
                tocContentDiv.style.display = "block";
                videoElement.pause();
            } else {
                tocContentDiv.style.display = "none";
                videoElement.style.display = "block";

                videoElement.src = currentSlide.file;
                videoElement.load();
                videoElement.play().catch(err => console.log("Așteaptă interacțiune directă", err));
            }

            indicatorElement.innerText = currentSlide.title;
            selectElement.value = currentIndex;
        }

        function nextPage() {
            currentIndex = (currentIndex < slides.length - 1) ? currentIndex + 1 : 0;
            updateBook();
        }

        function prevPage() {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : slides.length - 1;
            updateBook();
        }

        function jumpToSlide(index) {
            currentIndex = parseInt(index);
            updateBook();
        }

        document.addEventListener("keydown", (e) => {
            if (bookApp.style.display === "flex" && tocContentDiv.style.display === "none") {
                if (e.key === "ArrowRight") nextPage();
                if (e.key === "ArrowLeft") prevPage();
            }
        });

        window.onload = function() {
            initToc();
        };
    </script>
</body>
</html>
